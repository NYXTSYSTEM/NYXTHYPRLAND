[dock]
active_monitor_only = true
auto_hide = true
background_opacity = 0.84999998100101948
enabled = true
reserve_space = false
show_dots = true

[hooks]
battery_charging = "notify-send Charging"
battery_discharging = "notify-send -u critical \\ \"Discharging\""
battery_plugged = "notify-send \"Plugged in\""
logging_out = "notify-send -u critical \\ \"Loggin out...\""
rebooting = "notify-send -u critical \\ \"Rebooting...\""
session_unlocked = "notify-send \"Welcome back!\""
shutting_down = "notify-send -u critical \\ \"Shutting down...\""
started = "notify-send \"Welcome!\""

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 900.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 10800.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 3600.0

[keybinds]
copy = [ "Ctrl+Shift+c" ]

[location]
auto_locate = true

[lockscreen]
blurred_desktop = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001", "lockscreen-widget-0000000000000002" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1024.0
    cy = 960.0
    output = "eDP-1"
    placement_height = 1280.0
    placement_width = 2048.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = true
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = false
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 208.0
    box_width = 352.0
    cx = 240.00004577636719
    cy = 264.0
    output = "eDP-1"
    placement_height = 1280.0
    placement_width = 2048.0
    rotation = 0.0
    type = "media_player"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 480.0
    box_width = 592.0
    cx = 1024.0
    cy = 592.0001220703125
    output = "eDP-1"
    placement_height = 1280.0
    placement_width = 2048.0
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        bloom_intensity = 0.70000000000000007
        fade_when_idle = true
        inner_diameter = 0.75
        visualization_mode = "bars_rings"


[plugins]
enabled = []

[shell]
app_icon_colorize = true
avatar_path = "/home/nice/Downloads/profile.jpg"
panel_anchor_bar = "default"
password_style = "random"
polkit_agent = true

    [shell.launcher]
    show_app_actions = true

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "center"
    floating_layer = "top"
    floating_offset = 10
    list_item_background = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_wallpaper = true
    session_position = "center"
    transparency_mode = "glass"
    wallpaper_placement = "floating"
    wallpaper_position = "top_center"

    [shell.screen_corners]
    enabled = true
    size = 38

    [shell.screenshot]
    confirm_region = true
    directory = "/home/nice/Pictures"

[theme]
builtin = "Ayu"
community_palette = "Oxocarbon"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "hyprland", "kitty" ]
    community_ids = [ "neovim", "zed", "fastfetch", "hyprtoolkit", "bat" ]

[wallpaper]
directory = "/home/nice/.config/wallpapers"
fill_mode = "span"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/nice/.config/wallpapers/inverse2.jpg"

    [wallpaper.last]
    path = "/home/nice/.config/wallpapers/inverse2.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/nice/.config/wallpapers/inverse2.jpg"

[widget.audio_visualizer]
bands = 51
centered = false
color_2 = "on_primary"
scale = 1.5
