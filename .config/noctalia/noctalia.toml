[audio]
enable_sounds = true

[bar.default]
background_opacity = 0.80999998189508915
border_width = 2.0
capsule = true
capsule_thickness = 0.65999998897314072
concave_edge_corners = false
end = [ "media", "notifications", "group:g1", "volume", "brightness", "battery" ]
margin_edge = 3
margin_ends = 50
padding = 18
position = "left"
start = [ "launcher", "wallpaper", "workspaces", "audio_visualizer" ]
thickness = 30

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "network", "bluetooth" ]
    opacity = 1.0
    padding = 6.0

